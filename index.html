
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Home RD 3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101820;color:#fff}
header{padding:14px 18px;background:#172633;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h2{margin:0;color:#ff9d22}
main{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 60px)}
aside{background:#172633;padding:12px;display:flex;flex-direction:column;gap:7px}
button{border:0;border-radius:6px;padding:10px;background:#263b4d;color:white;cursor:pointer;text-align:left}
button:hover,button.active{background:#e88716;color:#111}
button.action{background:#e88716;color:#111;text-align:center;font-weight:bold}
#workspace{padding:12px;min-width:0}
#board{background:#fff;width:100%;height:calc(100vh - 100px);min-height:450px;border-radius:8px;touch-action:none}
svg{display:block}
.item{cursor:move}
.item.selected{filter:drop-shadow(0 0 4px #f90)}
#properties{background:#172633;padding:12px;margin-top:10px;border-radius:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{padding:8px;border-radius:5px;border:1px solid #777;max-width:150px}
.small{font-size:12px;color:#b9c6d0}
@media(max-width:650px){main{grid-template-columns:1fr}aside{display:grid;grid-template-columns:repeat(3,1fr)}#board{height:65vh}}
</style>
</head>
<body>
<header>
<h2>⚡ Smart Home RD 3.0</h2>
<span class="small">Projeto elétrico residencial</span>
</header>
<main>
<aside>
<button class="active" data-tool="select">↖ Selecionar / mover</button>
<button data-tool="wall">▰ Parede</button>
<button data-tool="door">🚪 Porta</button>
<button data-tool="window">▤ Janela</button>
<button data-tool="lamp">💡 Luminária</button>
<button data-tool="switch">◉ Interruptor simples</button>
<button data-tool="parallel">⇄ Paralelo</button>
<button data-tool="intermediate">⇆ Intermediário</button>
<button data-tool="smart">⌂ Inteligente</button>
<button data-tool="label">T Texto / cômodo</button>
<button data-tool="circuit">━ Ligação de circuito</button>
<button data-tool="erase">⌫ Apagar</button>
<hr>
<button class="action" id="undo">↶ Desfazer</button>
<button class="action" id="export">Salvar projeto JSON</button>
<button class="action" id="import">Importar projeto JSON</button>
<button class="action" id="clear">Limpar planta</button>
<input type="file" id="file" accept=".json" hidden>
<p class="small">Parede: clique e arraste.<br>Demais símbolos: clique no local desejado. Selecione um item para editar ou mover.</p>
</aside>
<section id="workspace">
<svg id="board" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
<path d="M20 0H0V20" fill="none" stroke="#e5e5e5" stroke-width="1"/>
</pattern>
</defs>
<rect width="1200" height="800" fill="url(#grid)"/>
<g id="drawings"></g>
</svg>
<div id="properties">
<strong>Propriedades:</strong>
<span id="selectedName" class="small">Nenhum item selecionado</span>
<label>Nome <input id="itemName" placeholder="Nome"></label>
<label>Circuito <input id="itemCircuit" placeholder="Ex.: C1"></label>
<button id="apply">Aplicar</button>
<button id="delete">Excluir selecionado</button>
</div>
</section>
</main>
<script>
const svg=document.getElementById('board');
const layer=document.getElementById('drawings');
let items=[],tool='select',selected=null,history=[],drawing=null,drag=null;
const $=id=>document.getElementById(id);

function save(){
 localStorage.setItem('smartHomeRD_v3',JSON.stringify(items));
}
function snapshot(){
 history.push(JSON.stringify(items));
 if(history.length>40)history.shift();
}
function undo(){
 if(!history.length)return;
 items=JSON.parse(history.pop());selected=null;render();save();
}
function point(e){
 const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
 return p.matrixTransform(svg.getScreenCTM().inverse());
}
function make(type,x,y,x2=x,y2=y){
 return {id:Date.now()+Math.random(),type,x,y,x2,y2,name:'',circuit:''};
}
function add(type,x,y,x2,y2){
 snapshot();const a=make(type,x,y,x2,y2);items.push(a);selected=a.id;render();save();
}
function render(){
 layer.innerHTML='';
 items.forEach(a=>{
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.classList.add('item');if(a.id===selected)g.classList.add('selected');
  g.dataset.id=a.id;
  const line=(x1,y1,x2,y2,color,width=5)=>el('line',{x1,y1,x2,y2,stroke:color,'stroke-width':width,'stroke-linecap':'round'});
  const circle=(cx,cy,r,stroke,fill='white')=>el('circle',{cx,cy,r,stroke,fill,'stroke-width':3});
  const text=(x,y,t,size=15)=>{let z=el('text',{x,y,'font-size':size,fill:'#111','text-anchor':'middle'});z.textContent=t;g.append(z)};
  if(a.type==='wall')g.append(line(a.x,a.y,a.x2,a.y2,'#222',8));
  if(a.type==='door'){
   g.append(line(a.x,a.y,a.x2,a.y2,'#a66b35',4));
   const r=Math.hypot(a.x2-a.x,a.y2-a.y);
   g.append(el('path',{d:`M ${a.x} ${a.y} A ${r} ${r} 0 0 1 ${a.x+r} ${a.y}`,fill:'none',stroke:'#a66b35','stroke-width':2}));
  }
  if(a.type==='window'){
   g.append(line(a.x-20,a.y,a.x+20,a.y,'#168bd0',5));
   g.append(line(a.x-20,a.y-5,a.x+20,a.y-5,'#168bd0',2));
   g.append(line(a.x-20,a.y+5,a.x+20,a.y+5,'#168bd0',2));
  }
  if(a.type==='lamp'){
   g.append(circle(a.x,a.y,14,'#e5a000','#fff4c4'));text(a.x,a.y+5,'✦',15);
  }
  if(['switch','parallel','intermediate','smart'].includes(a.type)){
   g.append(el('rect',{x:a.x-13,y:a.y-13,width:26,height:26,rx:4,fill:a.type==='smart'?'#b9e6ff':'white',stroke:'#168bd0','stroke-width':3}));
   text(a.x,a.y+5,a.type==='switch'?'S':a.type==='parallel'?'P':a.type==='intermediate'?'I':'Wi',11);
  }
  if(a.type==='label')text(a.x,a.y,a.name||'Cômodo',18);
  if(a.type==='circuit')g.append(line(a.x,a.y,a.x2,a.y2,'#e33',3));
  if(a.name && a.type!=='label')text(a.x,a.y+30,a.name,11);
  if(a.circuit)text(a.x,a.y-22,a.circuit,12);
  layer.append(g);
 });
}
function el(tag,attrs){
 const n=document.createElementNS('http://www.w3.org/2000/svg',tag);
 Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n;
}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
 tool=b.dataset.tool;
 document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));
});
svg.addEventListener('pointerdown',e=>{
 const p=point(e),g=e.target.closest('.item');
 if(tool==='select' && g){
  selected=Number(g.dataset.id);const a=items.find(x=>x.id===selected);
  $('selectedName').textContent=a.type;
  $('itemName').value=a.name||'';$('itemCircuit').value=a.circuit||'';
  snapshot();drag={id:selected,x:p.x,y:p.y,ox:a.x,oy:a.y,ox2:a.x2,oy2:a.y2};
  render();return;
 }
 if(tool==='select' && !g){selected=null;render();return;}
 if(tool==='erase'){
  if(g){snapshot();items=items.filter(a=>a.id!==Number(g.dataset.id));selected=null;render();save();}
  return;
 }
 if(tool==='wall'||tool==='circuit'){
  drawing={type:tool,x:p.x,y:p.y};svg.setPointerCapture(e.pointerId);return;
 }
 if(tool==='door')add('door',p.x,p.y,p.x+55,p.y);
 else add(tool,p.x,p.y);
});
svg.addEventListener('pointermove',e=>{
 const p=point(e);
 if(drag){
  const a=items.find(x=>x.id===drag.id);if(!a)return;
  const dx=p.x-drag.x,dy=p.y-drag.y;
  a.x=drag.ox+dx;a.y=drag.oy+dy;a.x2=drag.ox2+dx;a.y2=drag.oy2+dy;render();
 }
 if(drawing){
  render();layer.append(el('line',{x1:drawing.x,y1:drawing.y,x2:p.x,y2:p.y,stroke:drawing.type==='wall'?'#222':'#e33','stroke-width':drawing.type==='wall'?8:3,'stroke-dasharray':drawing.type==='wall'?'':'8 5'}));
 }
});
svg.addEventListener('pointerup',e=>{
 const p=point(e);
 if(drag){drag=null;save();}
 if(drawing){items.push(make(drawing.type,drawing.x,drawing.y,p.x,p.y));drawing=null;render();save();}
});
$('apply').onclick=()=>{
 const a=items.find(x=>x.id===selected);if(!a)return;
 snapshot();a.name=$('itemName').value;a.circuit=$('itemCircuit').value;render();save();
};
$('delete').onclick=()=>{
 if(!selected)return;snapshot();items=items.filter(x=>x.id!==selected);selected=null;render();save();
};
$('undo').onclick=undo;
$('clear').onclick=()=>{
 if(confirm('Apagar toda a planta? Faça uma cópia antes.')){snapshot();items=[];selected=null;render();save();}
};
$('export').onclick=()=>{
 const blob=new Blob([JSON.stringify({version:3,items},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='smart-home-rd-backup.json';a.click();URL.revokeObjectURL(a.href);
};
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const data=JSON.parse(await f.text());
  const arr=Array.isArray(data)?data:data.items;
  if(!Array.isArray(arr))throw Error('Formato inválido');
  snapshot();items=arr;selected=null;render();save();alert('Projeto importado!');
 }catch(err){alert('Não foi possível importar esse arquivo JSON.');}
 e.target.value='';
};
try{items=JSON.parse(localStorage.getItem('smartHomeRD_v3')||'[]');}catch(e){items=[];}
render();
</script>
</body>
</html>
